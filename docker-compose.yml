# Local stack: Postgres + .NET API + Python AI service.
#   cp .env.example .env        (and optionally AI_Models/.env.example -> AI_Models/.env for LLM keys)
#   docker compose up --build
#   cd Front-End && npm run dev  (Vite proxies /api to the API on :5171)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hirelens
      POSTGRES_USER: hirelens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hirelens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hirelens -d hirelens"]
      interval: 3s
      retries: 20

  ai:
    build: ./AI_Models
    env_file:
      - path: ./AI_Models/.env
        required: false
    ports:
      - "8000:8000"

  api:
    build: ./Back-End/ATStool
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=hirelens;Username=hirelens;Password=${POSTGRES_PASSWORD:-hirelens}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env (32+ characters)}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Seed__DemoPassword: ${SEED_DEMO_PASSWORD:-}
      AllowedOrigins__0: http://localhost:5173
      ExternalApi__ParsingUrl: http://ai:8000
      ExternalApi__BaseUrl: http://ai:8000/generate-jd
      ExternalApi__PdfUrl: http://ai:8000/download-pdf
      ATSScoreGeneration__BaseUrl: http://ai:8000
    ports:
      - "5171:8080"

volumes:
  pgdata:
